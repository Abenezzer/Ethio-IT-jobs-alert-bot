name: Daily IT Job Finder

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC = 07:00 AM EAT (UTC+3) daily
  workflow_dispatch: # Adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # Allows the workflow to push updated jobs.db back to the repo

jobs:
  run-job-finder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 #

      - name: Set up Python
        uses: actions/setup-python@v7 #
        with:
          python-version: "3.13" #
          cache: "pipenv" #

      - name: Install dependencies from Pipfile.lock
        run: |
          pip install pipenv
          pipenv install --deploy

      - name: Run the job finder script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: pipenv run python3 it_job_finder.py

      - name: Save updated jobs.db back to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          git diff --staged --quiet || git commit -m "chore: update seen jobs database"
          git push